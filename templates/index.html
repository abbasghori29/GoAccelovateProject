<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Finder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-briefcase"></i>Job Finder
            </a>
        </div>
    </nav>

    <div class="search-container">
        <div class="search-card">
            <h1 class="search-title">Find Your Dream Job</h1>
            <form id="jobSearchForm">
                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="position" class="form-label">Position</label>
                            <input type="text" class="form-control" id="position" placeholder="e.g., Software Engineer" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="experience" class="form-label">Experience</label>
                            <input type="text" class="form-control" id="experience" placeholder="e.g., 2 years" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="salary" class="form-label">Salary Range</label>
                            <input type="text" class="form-control" id="salary" placeholder="e.g., 70,000 PKR to 120,000 PKR" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="jobNature" class="form-label">Job Nature</label>
                            <select class="form-select" id="jobNature" required>
                                <option value="onsite">Onsite</option>
                                <option value="remote">Remote</option>
                                <option value="hybrid">Hybrid</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="location" class="form-label">Location</label>
                            <input type="text" class="form-control" id="location" placeholder="e.g., Karachi, Pakistan" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="skills" class="form-label">Skills</label>
                            <input type="text" class="form-control" id="skills" placeholder="e.g., Python, JavaScript, React" required>
                        </div>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-search me-2"></i>Search Jobs
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <div class="loading-spinner">
            <i class="fas fa-spinner"></i>
        </div>

        <div class="results-container" id="resultsContainer" style="display: none;">
            <h2 class="mb-4">Search Results</h2>
            <div id="resultsList">
                <!-- Results will be populated here -->
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
</body>
</html>
